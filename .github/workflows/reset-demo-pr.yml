name: Reset demo PR

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  reset-demo-pr:
    runs-on: ubuntu-latest
    env:
      BASE_REF: main
      SEED_REF: demo-seed
      HEAD_REF: demo-live
      PR_TITLE: Commentary demo review workspace
      PR_LABEL: commentary-demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "commentary-demo-bot"
          git config user.email "commentary-demo-bot@users.noreply.github.com"

      - name: Fetch demo branches
        run: |
          git fetch origin "${BASE_REF}" "${SEED_REF}" "${HEAD_REF}" || git fetch origin "${BASE_REF}" "${SEED_REF}"

      - name: Verify seed branch has commits
        id: commits
        shell: bash
        run: |
          set -euo pipefail
          commits="$(git rev-list --reverse "origin/${BASE_REF}..origin/${SEED_REF}")"
          if [ -z "$commits" ]; then
            echo "No curated commits found on ${SEED_REF}."
            exit 1
          fi

          {
            echo "commits<<EOF"
            echo "$commits"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Rebuild demo-live from main
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "${HEAD_REF}" "origin/${BASE_REF}"
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            git cherry-pick "$sha"
          done <<'EOF'
          ${{ steps.commits.outputs.commits }}
          EOF

      - name: Push refreshed demo-live branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${HEAD_REF}" >/dev/null 2>&1; then
            git push origin "${HEAD_REF}" --force-with-lease
          else
            git push origin "${HEAD_REF}"
          fi

      - name: Close current demo pull requests
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.COMMENTARY_DEMO_REPO_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base: process.env.BASE_REF,
              head: `${owner}:${process.env.HEAD_REF}`,
              per_page: 20,
            });

            for (const pull of pulls) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pull.number,
                state: "closed",
              });
            }

      - name: Ensure demo label exists
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.COMMENTARY_DEMO_REPO_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: process.env.PR_LABEL,
                color: "1f6feb",
                description: "Public demo pull request used by Commentary",
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
            }

      - name: Open fresh demo pull request
        id: create_pr
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.COMMENTARY_DEMO_REPO_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const body = [
              "Public sample pull request for Commentary's `/demo` route.",
              "",
              "This PR is reset on a schedule so new visitors see a clean review surface.",
              "",
              "- base branch: `main`",
              "- seed branch: `demo-seed`",
              "- live branch: `demo-live`",
            ].join("\n");

            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              title: process.env.PR_TITLE,
              head: process.env.HEAD_REF,
              base: process.env.BASE_REF,
              body,
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pull.number,
              labels: [process.env.PR_LABEL],
            });

            core.setOutput("pr_number", String(pull.number));
            core.setOutput("pr_url", pull.html_url);

      - name: Publish demo snapshot to Commentary
        if: ${{ vars.COMMENTARY_PUBLISH_URL != '' && secrets.COMMENTARY_PUBLISH_TOKEN != '' }}
        env:
          COMMENTARY_PUBLISH_URL: ${{ vars.COMMENTARY_PUBLISH_URL }}
          COMMENTARY_PUBLISH_TOKEN: ${{ secrets.COMMENTARY_PUBLISH_TOKEN }}
          COMMENTARY_SOURCE_GITHUB_TOKEN: ${{ secrets.COMMENTARY_DEMO_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${COMMENTARY_PUBLISH_TOKEN}" \
            --header "X-GitHub-Token: ${COMMENTARY_SOURCE_GITHUB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"kind\":\"demo_review\",\"owner\":\"${{ github.repository_owner }}\",\"repo\":\"${{ github.event.repository.name }}\",\"prNumber\":${{ steps.create_pr.outputs.pr_number }},\"defaultFilePath\":\"docs/overview.md\"}" \
            "${COMMENTARY_PUBLISH_URL}"

      - name: Warm Commentary demo route
        if: ${{ vars.COMMENTARY_DEMO_WARM_URL != '' }}
        run: |
          curl --fail --show-error --silent --location "${{ vars.COMMENTARY_DEMO_WARM_URL }}"

      - name: Print PR URL
        run: echo "Opened demo PR ${{ steps.create_pr.outputs.pr_url }}"
